# =============================================================================
# Supply Chain Security Workflow — Template
# npm audit, license compliance, dependency review, and Sigstore signing.
# =============================================================================
name: Supply Chain

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "30 6 * * 1" # Weekly Monday 06:30 UTC

permissions:
    contents: read

jobs:
    # ── npm audit + signatures ────────────────────────────────────────────────
    npm-audit:
        name: npm Audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
            - run: npm ci --ignore-scripts
            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high
            - name: Verify registry signatures
              run: npm audit signatures

    # ── License compliance ────────────────────────────────────────────────────
    license-check:
        name: License Compliance
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
            - run: npm ci --ignore-scripts
            - name: Check licenses
              run: npx --yes license-checker-rspack --production --failOn "GPL-3.0;AGPL-3.0;SSPL-1.0;EUPL-1.2"

    # ── GitHub Dependency Review (PRs only) ──────────────────────────────────
    dependency-review:
        name: Dependency Review
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/dependency-review-action@v4
              with:
                  fail-on-severity: high
                  deny-licenses: GPL-3.0, AGPL-3.0
