# =============================================================================
# Deploy static site to GitHub Pages
# Generic workflow — deploys repo root as-is (no build step)
# Use this for README landing pages or simple static sites.
# For repos with a build step (Vite, etc.), uncomment the build steps below
# and change 'path: "."' to 'path: "dist"'.
# =============================================================================
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Uncomment for Vite/Node projects ──────────────────────────────────
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"
      #     cache: "npm"
      #
      # - name: Install dependencies
      #   run: npm ci
      #
      # - name: Build
      #   run: npx vite build
      # ──────────────────────────────────────────────────────────────────────

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
