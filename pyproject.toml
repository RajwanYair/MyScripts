# =============================================================================
# WORKSPACE-LEVEL TOOL CONFIGURATION
# Universal Project Enhancement Framework v15.0.0
# =============================================================================
#
# This pyproject.toml provides SHARED TOOL DEFAULTS for all projects in this
# workspace. Individual projects should inherit and override as needed.
#
# Tools configured here:
#   ruff       - Linting + formatting (replaces flake8, black, isort, pep8)
#   mypy       - Static type checking
#   pytest     - Test runner
#   coverage   - Code coverage
#   black      - Code formatting (fallback)
#   isort      - Import sorting (fallback)
#   pylint     - Additional linting (optional)
#   hypothesis - Property-based testing
#   bandit     - Security linting
# =============================================================================

# =============================================================================
# RUFF - Fast Python Linter & Formatter (recommended over flake8/black/isort)
# =============================================================================

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests", "."]
extend-exclude = ["external", "archive", "node_modules"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no print() in production)
    "PTH",  # flake8-use-pathlib (pathlib over os.path)
    "PERF", # perflint (performance anti-patterns)
    "FURB", # refurb (modern Python idioms)
    "LOG",  # flake8-logging (logging best practices)
    "TCH",  # flake8-type-checking (TYPE_CHECKING imports)
]
ignore = [
    "E501", # line too long — handled by formatter
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "T201"]
"**/conftest.py" = ["S101", "ARG"]
"**/gui*.py" = ["T201"]
"**/cli*.py" = ["T201"]
"**/__main__.py" = ["T201"]
"**/main.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# =============================================================================
# MYPY - Static Type Checker
# =============================================================================

[tool.mypy]
python_version = "3.9"
# Start with standard and tighten per-project
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
# Don't require type annotations everywhere — opt in per project
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
# Ignore missing stubs for third-party packages
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests don't need full typing
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# GUI code tolerates dynamic attributes
module = "*.gui*"
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
# Common packages with incomplete stubs
module = [
    "tomli",
    "yaml",
    "pydantic.*",
    "rich.*",
    "click.*",
    "uvicorn.*",
    "fastapi.*",
    "jinja2.*",
    "PIL.*",
    "imagehash",
    "psutil.*",
    "send2trash",
    "darkdetect",
    "win32.*",
    "winreg",
    "comtypes.*",
    "tkinter.*",
]
ignore_missing_imports = true

# =============================================================================
# PYTEST - Test Runner
# =============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance benchmarks",
    "wsl: marks tests specific to WSL environment",
    "windows: marks tests specific to Windows",
    "linux: marks tests specific to Linux",
    "gui: marks tests that require a display",
    "network: marks tests that require network access",
    "admin: marks tests that require administrator/root privileges",
]
filterwarnings = ["error"]

# =============================================================================
# COVERAGE - Code Coverage
# =============================================================================

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/conftest.py",
    "*/__main__.py",
    "*/setup.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "@overload",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# =============================================================================
# BLACK - Code Formatter (kept for compatibility; prefer ruff format)
# =============================================================================

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313", "py314"]
include = '\\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | external
  | archive
)/
'''

# =============================================================================
# ISORT - Import Sorter (kept for compatibility; prefer ruff lint I rules)
# =============================================================================

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src"]
skip_glob = ["*/external/*", "*/archive/*", "*/.venv/*", "*/venv/*"]

# =============================================================================
# PYLINT - Additional Linting (optional, slower than ruff)
# =============================================================================
# No global message suppressions in the template.
# Project-specific disable rules belong in the child project's pyproject.toml.

[tool.pylint."messages_control"]
disable = []

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-branches = 20
max-statements = 80
max-args = 10
max-locals = 25

# =============================================================================
# HYPOTHESIS - Property-Based Testing
# =============================================================================

[tool.hypothesis]
# Default profile for local dev — fast
database = ".hypothesis/db"

[tool.hypothesis.settings]
max_examples = 100
deadline = 5000
suppress_health_check = ["too_slow", "data_too_large"]
deriving = true

# Use "ci" profile in CI environments via @settings(profile="ci")
# profiles.ci.max_examples = 500 is set per test file

# =============================================================================
# BANDIT - Security Linting
# =============================================================================

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "external",
    "archive",
    "build",
    "dist",
]
# No global skips — new projects should address all findings.
# Project-specific skips belong in the child project's pyproject.toml.

# =============================================================================
# HATCH - Build System (for projects that use hatchling)
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
