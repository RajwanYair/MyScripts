name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please check existing issues to avoid duplicates.

  - type: input
    id: project
    attributes:
      label: "📦 Project"
      description: Which sub-project or workspace area is this for?
      placeholder: "e.g. MyCliTool, MyWebApp, tooling/"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "🤔 Problem statement"
      description: What problem does this feature solve?
      placeholder: As a user, I want to... so that I can...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "💡 Proposed solution"
      description: Describe what you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "🔄 Alternatives considered"
      description: What other approaches did you consider?
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: "📊 Priority"
      options:
        - P0 — Critical (blocks work)
        - P1 — High (significant improvement)
        - P2 — Medium (nice to have)
        - P3 — Low (someday/maybe)
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "📎 Additional context"
      description: Any other context, mockups, or references.
    validations:
      required: false
