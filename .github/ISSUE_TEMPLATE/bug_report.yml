name: 🐛 Bug Report
description: Report unexpected behaviour or a broken feature
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please check the project changelog first — your issue may already be fixed.

  - type: input
    id: project
    attributes:
      label: "📦 Project"
      description: Which sub-project is affected?
      placeholder: "e.g. MyCliTool, MyWebApp, tooling/"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "📝 Description"
      description: A clear, concise description of the bug.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "🔁 Steps to reproduce"
      description: How can we reproduce this?
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ Expected behaviour"
      placeholder: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "❌ Actual behaviour"
      placeholder: What actually happens?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "🔖 Version"
      placeholder: "e.g. v2.1.0 or commit SHA"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: "💻 Operating system"
      options:
        - Windows
        - Linux
        - macOS
        - WSL
        - Other
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "📎 Additional context"
      description: Logs, screenshots, config files — anything helpful.
    validations:
      required: false
